name: Debug store detection

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Store URL to analyze"
        required: true
        default: "https://deespecialidadcafe.com/"
  push:
    branches:
      - claude/shopify-audit-url-failures-4nc677

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run detection debug against store
        run: node scripts/debug-store.mjs "${{ github.event.inputs.url || 'https://deespecialidadcafe.com/' }}"
